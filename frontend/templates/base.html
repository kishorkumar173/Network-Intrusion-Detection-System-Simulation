<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Defensive Network IDS Simulator | SOC Console{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom Cyber Theme CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="cyber-bg">

    <!-- Top Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark cyber-nav border-bottom border-secondary-subtle sticky-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center gap-2" href="/">
                <i class="fa-solid fa-shield-halved text-info fs-4"></i>
                <span class="fw-bold tracking-wide">AEGIS<span class="text-info">·IDS</span></span>
                <span class="badge bg-secondary-subtle text-info-emphasis border border-info-subtle ms-2 font-monospace" style="font-size: 0.7rem;">DEFENSIVE LAB</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4 gap-lg-2">
                    <li class="nav-item">
                        <a class="nav-link px-3" href="/"><i class="fa-solid fa-chart-line me-1"></i> SOC Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" href="/investigation"><i class="fa-solid fa-magnifying-glass me-1"></i> Event Investigation</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" href="/incidents"><i class="fa-solid fa-list-check me-1"></i> Incident Management</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <div class="d-flex align-items-center gap-2 text-secondary font-monospace" style="font-size: 0.85rem;">
                        <span class="pulse-indicator bg-success"></span>
                        <span>MONITORING: ACTIVE</span>
                    </div>
                    <span class="badge bg-dark border border-secondary text-light font-monospace py-2 px-3">
                        <i class="fa-solid fa-server text-info me-1"></i> RFC 5737 LOCAL LAB
                    </span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main View Container -->
    <main class="container-fluid px-4 py-3">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer py-3 border-top border-secondary-subtle text-center text-secondary font-monospace" style="font-size: 0.8rem;">
        <div class="container-fluid">
            <span>Defensive Network Intrusion Detection System (IDS) Simulation &bull; Strictly Isolated Lab Synthetic Data</span>
        </div>
    </footer>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
